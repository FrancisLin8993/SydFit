name: Deploy SydFit API
on:
  push:
    branches:
      - main

env:
  REGION:  australia-southeast1
  SERVICE: sydfit-api
  IMAGE:   australia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sydfit-api-artifacts/sydfit-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --platform managed
            --memory 1Gi
            --cpu 1
            --allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --service-account=github-actions-sydfit-api@personal-assistant-mem0-499203.iam.gserviceaccount.com
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=gpt-5.4-mini
            BARK_DEVICE_KEY=${{ secrets.BARK_DEVICE_KEY }}
            BARK_SERVER_URL=https://api.day.app
            BARK_GROUP=Weather
            BARK_LEVEL=active
            SCHEDULE_TIMEZONE=Australia/Sydney
            TFNSW_API_KEY=${{ secrets.TFNSW_API_KEY }}
            MEM0_API_KEY=${{ secrets.MEM0_API_KEY }}
            SYDFIT_API_KEY=${{ secrets.SYDFIT_API_KEY }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ secrets.GCP_LOCATION }}
            GCP_QUEUE_NAME=${{ secrets.GCP_QUEUE_NAME }}
            SYDFIT_SERVICE_URL=${{ secrets.SYDFIT_SERVICE_URL }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_BASE_URL=${{ secrets.LANGFUSE_BASE_URL }}