name: Deploy SydFit API
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 这里假设你已经配置好了 Workload Identity Federation 或 GCP Credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: sydfit-api
          region: australia-southeast1 # 悉尼节点
          source: .
          # 💡 核心保护参数
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --service-account=sydfit-identity@your-project-id.iam.gserviceaccount.com
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=gpt-5.4-mini
            BARK_DEVICE_KEY=${{ secrets.BARK_DEVICE_KEY }}
            BARK_SERVER_URL=https://api.day.app
            BARK_GROUP=Weather
            BARK_LEVEL=active
            SCHEDULE_TIMEZONE=Australia/Sydney
            MCP_SERVER_URL=${{ secrets.MCP_SERVER_URL }}
            MCP_ACCESS_TOKEN=${{ secrets.MCP_ACCESS_TOKEN }}
            MEM0_ACCESS_TOKEN=${{ secrets.MEM0_ACCESS_TOKEN }}
            MEM0_API_URL=${{ secrets.MEM0_API_URL }}
            SYDFIT_API_KEY=${{ secrets.SYDFIT_API_KEY }}