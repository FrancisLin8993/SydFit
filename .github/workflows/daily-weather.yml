name: Daily weather notification

on:
  schedule:
    # GitHub Actions cron is UTC. These two times cover 7:00 AM Sydney time
    # across daylight saving and standard time; src/index.js sends only when
    # Australia/Sydney is actually 7:00 AM.
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Send notification
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            node src/index.js --force
          else
            node src/index.js
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          BARK_SERVER_URL: ${{ vars.BARK_SERVER_URL || 'https://api.day.app' }}
          BARK_GROUP: ${{ vars.BARK_GROUP || 'Weather' }}
          BARK_LEVEL: ${{ vars.BARK_LEVEL || 'active' }}
          SCHEDULE_TIMEZONE: Australia/Sydney
